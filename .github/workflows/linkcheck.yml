name: Link check

on:
  schedule: [{ cron: '0 3 1 * *' }]   # 매월 1일
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail 'src/data/**/*.yml'
          fail: true
